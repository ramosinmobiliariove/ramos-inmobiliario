<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Propuesta Inmobiliaria | Ramos Inmobiliario</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #0f172a;
      --accent: #16a34a;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    header {
      background: var(--primary);
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    header h1 { font-size: 1.4rem; letter-spacing: 0.5px; }
    header p { font-size: 0.9rem; color: #cbd5e1; margin-top: 4px; }
    .container {
      max-width: 1000px;
      margin: 28px auto;
      padding: 0 16px;
    }
    .client-banner {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 22px;
      margin-bottom: 24px;
    }
    .grid {
      display: grid;
      gap: 24px;
    }
    .property-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 8px;
      padding: 12px;
      background: #f1f5f9;
    }
    .gallery img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
    }
    .card-body {
      padding: 20px 24px;
    }
    .meta-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 8px;
    }
    .zone {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
    }
    .price {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary);
    }
    .specs {
      font-size: 0.92rem;
      color: var(--muted);
      margin-bottom: 14px;
      font-weight: 500;
    }
    .desc {
      white-space: pre-line;
      margin-bottom: 20px;
      color: #334155;
    }
    .btn-wa {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .btn-wa:hover { opacity: 0.92; }
    .state-msg {
      text-align: center;
      padding: 48px 16px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <h1>Ramos Inmobiliario</h1>
    <p>Selección personalizada de propiedades</p>
  </header>

  <div class="container">
    <div id="client-banner" class="client-banner" style="display:none;"></div>
    <div id="contenedor" class="grid">
      <div class="state-msg">Cargando opciones seleccionadas...</div>
    </div>
  </div>

  <script>
    // Reemplaza este número con tu WhatsApp en formato internacional (ej. 584121234567)
    const TU_WHATSAPP = '584120000000';

    // Pega aquí la URL de tu Google Sheet publicada como CSV o tu endpoint de lectura
    // Ejemplo: 'https://docs.google.com/spreadsheets/d/TU_ID/gviz/tq?tqx=out:csv&sheet=Propuestas'
    const SHEET_CSV_URL = '';

    function parseCSV(text) {
      const rows = [];
      let current = [], value = '', inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i], next = text[i + 1];
        if (ch === '"' && inQuotes && next === '"') { value += '"'; i++; }
        else if (ch === '"') { inQuotes = !inQuotes; }
        else if (ch === ',' && !inQuotes) { current.push(value); value = ''; }
        else if ((ch === '\n' || ch === '\r') && !inQuotes) {
          if (value !== '' || current.length) { current.push(value); rows.push(current); }
          current = []; value = '';
        } else { value += ch; }
      }
      if (value !== '' || current.length) { current.push(value); rows.push(current); }
      return rows;
    }

    async function cargarPropuesta() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const contenedor = document.getElementById('contenedor');

      if (!id) {
        contenedor.innerHTML = '<div class="state-msg">Enlace de propuesta no válido.</div>';
        return;
      }

      if (!SHEET_CSV_URL) {
        contenedor.innerHTML = '<div class="state-msg">Configura SHEET_CSV_URL en propuesta.html para conectar la pestaña Propuestas.</div>';
        return;
      }

      try {
        const res = await fetch(SHEET_CSV_URL);
        const csv = await res.text();
        const rows = parseCSV(csv).slice(1); // Omitir cabecera

        // Filtrar solo las filas de este cliente (Columna A = id_propuesta)
        // Nota: Nunca leemos ni mostramos la Columna I (nota_privada)
        const items = rows.filter(r => (r[0] || '').trim() === id.trim());

        if (!items.length) {
          contenedor.innerHTML = '<div class="state-msg">No se encontraron propiedades para este enlace.</div>';
          return;
        }

        const nombreCliente = (items[0][1] || '').trim();
        if (nombreCliente) {
          const banner = document.getElementById('client-banner');
          banner.style.display = 'block';
          banner.innerHTML = `<strong>Propuesta preparada para:</strong> ${nombreCliente}`;
        }

        contenedor.innerHTML = items.map(item => {
          const titulo = item[2] || 'Inmueble seleccionado';
          const zona = item[3] || '';
          const precio = item[4] || 'Consultar';
          const detalles = item[5] || '';
          const descripcion = item[6] || '';
          const fotos = (item[7] || '')
            .split(',')
            .map(u => u.trim())
            .filter(Boolean);

          const fotosHtml = fotos.length
            ? `<div class="gallery">${fotos.map(f => `<img src="${f}" alt="${titulo}" loading="lazy">`).join('')}</div>`
            : '';

          const mensajeWa = encodeURIComponent(
            `Hola, me interesa recibir más información sobre esta opción de tu propuesta: ${titulo} (${zona}).`
          );

          return `
            <article class="property-card">
              ${fotosHtml}
              <div class="card-body">
                <div class="meta-top">
                  <span class="zone">${zona}</span>
                  <span class="price">${precio}</span>
                </div>
                <h2>${titulo}</h2>
                <div class="specs">${detalles}</div>
                <p class="desc">${descripcion}</p>
                <a class="btn-wa" href="https://wa.me/${TU_WHATSAPP}?text=${mensajeWa}" target="_blank" rel="noopener">
                  Consultar esta opción por WhatsApp
                </a>
              </div>
            </article>
          `;
        }).join('');
      } catch (err) {
        contenedor.innerHTML = '<div class="state-msg">Error al cargar la propuesta. Intenta nuevamente más tarde.</div>';
      }
    }

    cargarPropuesta();
  </script>
</body>
</html>
